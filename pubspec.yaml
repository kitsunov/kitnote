name: kitnote
description: "KitNote - Pro Note Taking & Large PDF Annotation app with Palm Rejection, Split View, and Cloud Sync."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  file_picker: ^8.1.7
  flutter_colorpicker: ^1.1.0
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.2
  intl: ^0.20.3
  pdf: ^3.11.1
  printing: ^5.13.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
